# alembic.ini - Alembic 메인 설정 파일
#
# 역할:
#   - DB 연결 URL 지정
#   - 마이그레이션 스크립트 위치 설정
#   - 로깅 설정

[alembic]
# 마이그레이션 스크립트 디렉토리 경로
script_location = alembic

# PostgreSQL 연결 URL (database.py의 DATABASE_URL과 동일하게 유지)
sqlalchemy.url = postgresql://postgres:password@localhost:5432/resource_db

# 마이그레이션 파일명 템플릿
# %%(rev)s   → revision ID (해시)
# %%(slug)s  → 설명 텍스트 (slugified)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
